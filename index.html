<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GLITCH_SNAKE_SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-cyan: #00ffff;
        --color-magenta: #ff00ff;
        --color-yellow: #ffff00;
        --color-black: #050505;
      }
      body {
        font-family: 'VT323', monospace;
        background-color: var(--color-black);
        color: var(--color-cyan);
        overflow-x: hidden;
      }
      h1, h2, h3, h4, .retro-font {
        font-family: 'Press Start 2P', cursive;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 12px;
        background: #000;
        border-left: 2px solid var(--color-magenta);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-cyan);
        border: 2px solid #000;
        box-shadow: inset -2px -2px 0px rgba(0,0,0,0.5);
      }

      /* CRT Scanline Effect */
      .scanlines {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0,0,0,0.3) 50%,
          rgba(0,0,0,0.3)
        );
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 9999;
        animation: scanlineScroll 10s linear infinite;
      }
      
      @keyframes scanlineScroll {
        0% { background-position: 0 0; }
        100% { background-position: 0 100%; }
      }

      /* Glitch Text Effect */
      .glitch-text {
        position: relative;
        display: inline-block;
      }
      .glitch-text::before,
      .glitch-text::after {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--color-black);
      }
      .glitch-text::before {
        left: 2px;
        text-shadow: -2px 0 var(--color-magenta);
        clip: rect(24px, 550px, 90px, 0);
        animation: glitch-anim-2 3s infinite linear alternate-reverse;
      }
      .glitch-text::after {
        left: -2px;
        text-shadow: -2px 0 var(--color-yellow);
        clip: rect(85px, 550px, 140px, 0);
        animation: glitch-anim 2.5s infinite linear alternate-reverse;
      }

      @keyframes glitch-anim {
        0% { clip: rect(13px, 9999px, 86px, 0); transform: skew(0.85deg); }
        5% { clip: rect(65px, 9999px, 19px, 0); transform: skew(0.85deg); }
        10% { clip: rect(6px, 9999px, 12px, 0); transform: skew(0.06deg); }
        15% { clip: rect(89px, 9999px, 5px, 0); transform: skew(0.12deg); }
        20% { clip: rect(23px, 9999px, 95px, 0); transform: skew(0.44deg); }
        25% { clip: rect(98px, 9999px, 16px, 0); transform: skew(0.39deg); }
        30% { clip: rect(2px, 9999px, 78px, 0); transform: skew(0.08deg); }
        35% { clip: rect(66px, 9999px, 13px, 0); transform: skew(0.34deg); }
        40% { clip: rect(48px, 9999px, 49px, 0); transform: skew(0.79deg); }
        45% { clip: rect(10px, 9999px, 96px, 0); transform: skew(0.02deg); }
        50% { clip: rect(4px, 9999px, 3px, 0); transform: skew(0.31deg); }
        55% { clip: rect(64px, 9999px, 98px, 0); transform: skew(0.74deg); }
        60% { clip: rect(32px, 9999px, 69px, 0); transform: skew(0.24deg); }
        65% { clip: rect(96px, 9999px, 20px, 0); transform: skew(0.96deg); }
        70% { clip: rect(44px, 9999px, 10px, 0); transform: skew(0.82deg); }
        75% { clip: rect(100px, 9999px, 63px, 0); transform: skew(0.53deg); }
        80% { clip: rect(19px, 9999px, 82px, 0); transform: skew(0.57deg); }
        85% { clip: rect(27px, 9999px, 15px, 0); transform: skew(0.66deg); }
        90% { clip: rect(54px, 9999px, 93px, 0); transform: skew(0.81deg); }
        95% { clip: rect(38px, 9999px, 4px, 0); transform: skew(0.81deg); }
        100% { clip: rect(22px, 9999px, 76px, 0); transform: skew(0.65deg); }
      }
      @keyframes glitch-anim-2 {
        0% { clip: rect(65px, 9999px, 11px, 0); transform: skew(0.72deg); }
        5% { clip: rect(12px, 9999px, 24px, 0); transform: skew(0.32deg); }
        10% { clip: rect(98px, 9999px, 87px, 0); transform: skew(0.6deg); }
        15% { clip: rect(32px, 9999px, 5px, 0); transform: skew(0.92deg); }
        20% { clip: rect(8px, 9999px, 99px, 0); transform: skew(0.85deg); }
        25% { clip: rect(4px, 9999px, 2px, 0); transform: skew(0.19deg); }
        30% { clip: rect(55px, 9999px, 66px, 0); transform: skew(0.94deg); }
        35% { clip: rect(33px, 9999px, 12px, 0); transform: skew(0.23deg); }
        40% { clip: rect(77px, 9999px, 34px, 0); transform: skew(0.12deg); }
        45% { clip: rect(66px, 9999px, 44px, 0); transform: skew(0.65deg); }
        50% { clip: rect(22px, 9999px, 99px, 0); transform: skew(0.23deg); }
        55% { clip: rect(11px, 9999px, 88px, 0); transform: skew(0.65deg); }
        60% { clip: rect(88px, 9999px, 33px, 0); transform: skew(0.44deg); }
        65% { clip: rect(44px, 9999px, 55px, 0); transform: skew(0.12deg); }
        70% { clip: rect(99px, 9999px, 22px, 0); transform: skew(0.34deg); }
        75% { clip: rect(12px, 9999px, 76px, 0); transform: skew(0.55deg); }
        80% { clip: rect(23px, 9999px, 34px, 0); transform: skew(0.77deg); }
        85% { clip: rect(87px, 9999px, 43px, 0); transform: skew(0.88deg); }
        90% { clip: rect(34px, 9999px, 98px, 0); transform: skew(0.99deg); }
        95% { clip: rect(65px, 9999px, 12px, 0); transform: skew(0.11deg); }
        100% { clip: rect(43px, 9999px, 23px, 0); transform: skew(0.22deg); }
      }
      
      .clip-corner {
        clip-path: polygon(
          0 0, 
          100% 0, 
          100% calc(100% - 20px), 
          calc(100% - 20px) 100%, 
          0 100%
        );
      }
      
      .clip-corner-rev {
        clip-path: polygon(
          20px 0, 
          100% 0, 
          100% 100%, 
          0 100%, 
          0 20px
        );
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
  <body>
    <div class="scanlines"></div>
    <div id="root"></div>
  </body>
</html>
